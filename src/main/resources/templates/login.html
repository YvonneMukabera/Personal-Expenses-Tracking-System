<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card animate-slideUp">
    <div class="auth-brand">
        <img th:src="@{/images/logo.png}" class="auth-logo" alt="Expense Tracker Logo">
        <span>Personal Expense Tracker</span>
    </div>
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in to review your expenses, income, and FRW balance.</p>

    <div th:if="${param.error}" class="error-msg">Invalid username or password.</div>
    <div th:if="${param.registered}" class="success-msg">Registration successful! Please login.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>

        <div class="form-check">
            <input type="checkbox" name="remember-me" id="rememberMe">
            <label for="rememberMe">Keep me logged in</label>
        </div>

        <button type="submit" class="btn-auth">Login</button>
    </form>
    <p class="auth-footer">Need an account? <a th:href="@{/register}">Register</a></p>
</div>
</body>
</html>
