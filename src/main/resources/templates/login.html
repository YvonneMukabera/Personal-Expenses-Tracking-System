<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="auth-body">

<div class="auth-container">

    <!-- LOGO -->
    <div class="logo-box">
        <img th:src="@{/images/logo.png}" src="/images/logo.png" class="logo" alt="Login Logo">
        <h2>Personal Expenses Tracking System</h2>
        <p>Manage your money professionally</p>
    </div>

    <!-- ERROR / LOGOUT MESSAGES -->
    <div th:if="${param.error}" style="color:red; text-align:center;">
        Invalid username or password
    </div>

    <div th:if="${param.logout}" style="color:green; text-align:center;">
        You have been logged out
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}" method="post" class="auth-form">

        <input type="text" name="username" placeholder="Username" required>

        <input type="password" name="password" placeholder="Password" required>

        <div class="remember-me">
            <input type="checkbox" id="rememberMe" name="remember-me">
            <label for="rememberMe">Remember Me</label>
        </div>

        <button type="submit">Login</button>

        <p class="auth-link">
            Don’t have an account?
            <a th:href="@{/register}">Register</a>
        </p>

    </form>

</div>

</body>
</html>
