<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card animate-slideUp">
    <div class="auth-brand">
        <img th:src="@{/images/logo.png}" class="auth-logo" alt="Expense Tracker Logo">
        <span>Personal Expense Tracker</span>
    </div>
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join the system and start tracking your personal finances in FRW.</p>
    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn-auth">Join Now</button>
    </form>
    <p class="auth-footer">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
