<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<h2 class="page-title">Finance Dashboard</h2>

<!--   FILTER + INCOME   -->
<div class="table-container">

    <form th:action="@{/dashboard}" method="get">

        <label>Month:</label>
        <input type="number" name="month" min="1" max="12" th:value="${month}" required>

        <label>Year:</label>
        <input type="number" name="year" th:value="${year}" required>

        <button type="submit">View</button>

    </form>

    <br/>

    <form th:action="@{/income/save}" method="post">

        <input type="hidden" name="month" th:value="${month}">
        <input type="hidden" name="year" th:value="${year}">

        <label>Set Income:</label>
        <input type="number" step="0.01" name="amount" placeholder="Enter income" required>

        <button type="submit">Save Income</button>

    </form>

</div>

<!--SUMMARY CARD -->
<div class="table-container">

    <div class="summary-cards">

        <div class="card ">
            <h3>Total Income</h3>
            <p th:text="${totalIncome} + ' FRW'"></p>
        </div>

        <div class="card ">
            <h3>Total Expenses</h3>
            <p th:text="${totalExpenses} + ' FRW'"></p>
        </div>

        <div class="card ">
            <h3>Balance</h3>
            <p th:text="${balance} + ' FRW'"
               th:style="${balance >= 0} ? 'color:green;' : 'color:red;'">
            </p>
        </div>

    </div>
</div>

<!-- EXPENSE TABLE -->
<div class="table-container">

    <h3>Expenses for Selected Month</h3>

    <table border="1">

        <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Unit Cost</th>
            <th>Total</th>
            <th>Date</th>
        </tr>

        <tr th:each="expense : ${expenses}">
            <td th:text="${expense.title}"></td>
            <td th:text="${expense.category}"></td>
            <td th:text="${expense.amount}"></td>
            <td th:text="${expense.unitCost}"></td>
            <td th:text="${expense.amount * expense.unitCost}"></td>
            <td th:text="${expense.date}"></td>
        </tr>

    </table>

</div>

<!--CHART-->
<h3>Expenses-Income chart for Selected Month</h3>
<div style="margin-top: 30px;">
    <canvas id="financeChart"></canvas>
</div>

<!--  SCRIPTS   -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">
    window.income = [[${totalIncome}]];
    window.expenses = [[${totalExpenses}]];
</script>

<script src="/js/app.js"></script>

<!--   BACK   -->
<div style="margin-top:20px;">
    <a th:href="@{/}"> Back to Expenses</a>
</div>

</body>
</html>
