<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Finance Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<h2 class="page-title">Finance Dashboard</h2>

<!-- FILTERS -->
<div class="table-container">

    <!-- MONTH FILTER -->
    <form th:action="@{/dashboard}" method="get">

        <label>Month:</label>
        <input type="number" name="month" min="1" max="12" th:value="${month}" required>

        <label>Year:</label>
        <input type="number" name="year" th:value="${year}" required>

        <button type="submit">View</button>
    </form>

    <br/>

    <!-- YEAR FILTER -->
    <form th:action="@{/dashboard}" method="get">

        <input type="hidden" name="yearly" value="true">

        <label>Year Only:</label>
        <input type="number" name="year" th:value="${year}" required>

        <button type="submit">View Year</button>
    </form>

</div>

<!-- ================= MONTH VIEW ================= -->
<div th:if="${yearOnly == false}">

    <div class="table-container">

        <div class="summary-cards">

            <div class="card">
                <h3>Total Income</h3>
                <p th:text="${totalIncome} + ' FRW'"></p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p th:text="${totalExpenses} + ' FRW'"></p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p th:text="${balance} + ' FRW'"
                   th:style="${balance >= 0} ? 'color:green;' : 'color:red;'"></p>
            </div>

        </div>

    </div>

    <div class="table-container">

        <h3>Expenses for Selected Month</h3>

        <table border="1">

            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Unit Cost</th>
                <th>Total</th>
                <th>Date</th>
            </tr>

            <tr th:each="expense : ${expenses}">
                <td th:text="${expense.title}"></td>
                <td th:text="${expense.category}"></td>
                <td th:text="${expense.amount}"></td>
                <td th:text="${expense.unitCost}"></td>
                <td th:text="${expense.amount * expense.unitCost}"></td>
                <td th:text="${expense.date}"></td>
            </tr>

        </table>

    </div>

    <h3>Monthly Chart</h3>
    <div style="margin-top: 30px;">
        <canvas id="financeChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        window.income = [[${totalIncome}]];
        window.expenses = [[${totalExpenses}]];
    </script>

    <script src="/js/app.js"></script>

</div>

<!-- ================= YEAR VIEW ================= -->
<div th:if="${yearOnly == true}">

    <div class="table-container">

        <div class="summary-cards">

            <div class="card">
                <h3>Total Income</h3>
                <p th:text="${totalIncome} + ' FRW'"></p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p th:text="${totalExpenses} + ' FRW'"></p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p th:text="${balance} + ' FRW'"
                   th:style="${balance >= 0} ? 'color:green;' : 'color:red;'"></p>
            </div>

        </div>

    </div>

    <div class="table-container">

        <h3>Yearly Summary</h3>

        <table border="1">

            <tr>
                <th>Month</th>
                <th>Income</th>
                <th>Expenses</th>
                <th>Balance</th>
            </tr>

            <tr th:each="i : ${#numbers.sequence(1,12)}">

                <td th:text="${i}"></td>
                <td th:text="${incomePerMonth[i-1]}"></td>
                <td th:text="${expensePerMonth[i-1]}"></td>
                <td th:text="${incomePerMonth[i-1] - expensePerMonth[i-1]}"></td>

            </tr>

        </table>

    </div>

    <h3>Yearly Chart</h3>

    <div style="margin-top: 30px;">
        <canvas id="yearChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">

        const incomeData = /*[[${incomePerMonth}]]*/ [];
        const expenseData = /*[[${expensePerMonth}]]*/ [];

        new Chart(document.getElementById("yearChart"), {
            type: "line",
            data: {
                labels: ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
                datasets: [
                    {
                        label: "Income",
                        data: incomeData,
                        borderColor: "green",
                        fill: false
                    },
                    {
                        label: "Expenses",
                        data: expenseData,
                        borderColor: "red",
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                tension: 0.3
            }
        });

    </script>

</div>

<!-- BACK -->
<div style="margin-top:20px;">
    <a th:href="@{/(page=${page})}"> Back to Expenses</a>
</div>

</body>
</html>
