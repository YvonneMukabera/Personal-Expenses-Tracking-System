<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h2 class="page-title">My Expenses</h2>

<div class="table-container">

    <table border="1">

        <tr>
            <th>No</th>
            <th>Title</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Unit Cost/FRW</th>
            <th>Total</th>
            <th>Date</th>
            <th>Action</th>
        </tr>

        <tr th:each="expense, iterStat : ${expenses}">
            <td th:text="${currentPage * pageSize + iterStat.index + 1}"></td>
            <td th:text="${expense.title}"></td>
            <td th:text="${expense.category}"></td>
            <td th:text="${expense.amount}"></td>
            <td th:text="${expense.unitCost}"></td>
            <td th:text="${expense.total}"></td>
            <td th:text="${expense.date}"></td>

            <td>
                <!-- EDIT (keeps page) -->
                <a th:href="@{/edit/{id}(id=${expense.id}, page=${currentPage})}">
                    Edit
                </a>

                <!-- DELETE (FIXED SYNTAX) -->
                <a href="#"
                   th:attr="data-url=@{/delete/{id}(id=${expense.id}, page=${currentPage})}"
                   onclick="openDeleteModal(this); return false;">
                    Delete
                </a>
            </td>
        </tr>

    </table>

    <br/>

    <!-- ADD EXPENSE (keeps page) -->
    <a th:href="@{/new(page=${currentPage})}">
        Add Expense
    </a>

    <br/>

    <!-- DASHBOARD -->
    <a th:href="@{/dashboard}">
        View Dashboard
    </a>

    <!-- PAGINATION -->
    <div style="margin-top: 20px; text-align: center;">

        <a th:if="${currentPage > 0}"
           th:href="@{/(page=${currentPage - 1})}">
            Previous
        </a>

        <span style="margin: 0 10px;">
            Page <span th:text="${currentPage + 1}"></span>
            of <span th:text="${totalPages}"></span>
        </span>

        <a th:if="${currentPage + 1 < totalPages}"
           th:href="@{/(page=${currentPage + 1})}">
            Next
        </a>

    </div>

</div>

<!-- DELETE MODAL -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <p>Are you sure you want to delete this expense?</p>

        <button id="confirmBtn">Yes</button>
        <button id="cancelBtn">No</button>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
