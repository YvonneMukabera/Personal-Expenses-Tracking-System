<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h2 class="page-title">My Expenses</h2>


<div class="table-container">
<table border="1">
    <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Amount</th>
        <th>Unit Cost/FRW</th>
        <th>Date</th>
        <th>Action</th>
    </tr>

    <tr th:each="expense : ${expenses}">
        <td th:text="${expense.title}"></td>
        <td th:text="${expense.category}"></td>
        <td th:text="${expense.amount}"></td>
        <td th:text="${expense.unitCost}"></td>
        <td th:text="${expense.date}"></td>
        <td>
            <a th:href="@{/edit/{id}(id=${expense.id})}">Edit</a>
            <a href="#"
               th:attr="data-url=@{'/delete/' + ${expense.id}}"
               onclick="openDeleteModal(this); return false;">
                Delete
            </a>
        </td>
    </tr>
</table>
    </p></p>
    <a th:href="@{/new}">Add Expense</a>
</div>
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <p>Are you sure you want to delete this expense?</p>

        <button id="confirmBtn">Yes</button>
        <button id="cancelBtn">No</button>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>

</html>
