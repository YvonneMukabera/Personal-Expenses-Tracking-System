<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Expenses</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="layout">

    <!-- SIDEBAR  -->
    <div class="sidebar">
        <div class="sdbr">
            <!--     <h3 class="sidebar-title">Menu</h3> -->
            <a th:href="@{/(page=${page})}" class="sidebar-link active">
                Expenses
            </a>

            <a th:href="@{/dashboard}" class="sidebar-link">
                Dashboard
            </a>

            <!-- ADD EXPENSE -->
            <a th:href="@{/new(page=${currentPage})}" class="sidebar-link" >
                Add Expense
            </a>
            <a th:href="@{/about}"
               class="sidebar-link">
                About
            </a>
        </div>
    </div>

    <!-- YOUR ORIGINAL CONTENT (UNCHANGED, JUST WRAPPED) -->
    <div class="main-content">

        <h2 class="page-title">My Expenses</h2>

        <br/>

        <div class="table-container">

            <table border="1">

                <tr>
                    <th>No</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Unit Cost/FRW</th>
                    <th>Total</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>

                <tr th:each="expense, iterStat : ${expenses}">
                    <td th:text="${currentPage * pageSize + iterStat.index + 1}"></td>
                    <td th:text="${expense.title}"></td>
                    <td th:text="${expense.category}"></td>
                    <td th:text="${expense.amount}"></td>
                    <td th:text="${expense.unitCost}"></td>
                    <td th:text="${expense.total}"></td>
                    <td th:text="${expense.date}"></td>

                    <td>
                        <!-- EDIT (keeps page) -->
                        <a th:href="@{/edit/{id}(id=${expense.id}, page=${currentPage})}">
                            Edit
                        </a>

                        <!-- DELETE -->
                        <a href="#"
                           th:attr="data-url=@{/delete/{id}(id=${expense.id}, page=${currentPage})}"
                           onclick="openDeleteModal(this); return false;">
                            Delete
                        </a>
                    </td>
                </tr>

            </table>

            <br/>


            <!-- PAGINATION -->
            <div style="margin-top: 20px; text-align: center;">

                <a th:if="${currentPage > 0}"
                   th:href="@{/(page=${currentPage - 1})}">
                    Previous
                </a>

                <span style="margin: 0 10px;">
                    Page <span th:text="${currentPage + 1}"></span>
                    of <span th:text="${totalPages}"></span>
                </span>

                <a th:if="${currentPage + 1 < totalPages}"
                   th:href="@{/(page=${currentPage + 1})}">
                    Next
                </a>

            </div>

        </div>

    </div>

</div>

<!-- DELETE MODAL (UNCHANGED) -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <p>Are you sure you want to delete this expense?</p>

        <button id="confirmBtn">Yes</button>
        <button id="cancelBtn">No</button>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>

</body>
</html>
