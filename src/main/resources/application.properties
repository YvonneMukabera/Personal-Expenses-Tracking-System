spring.application.name=Personal Expense Tracking System

spring.datasource.url=jdbc:mysql://localhost:3307/expensedb
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.database.managed-tables=users,expense,income
app.database.legacy-table-migrations=expenses:expense,incomes:income
app.database.archive-unmanaged-tables=true
app.database.archive-schema=expensedb_archive
app.database.fail-on-unmanaged-tables=false
#staying logged in for 48hrs
server.servlet.session.timeout=48h
#  DEBUG ERROR DISPLAY (ADDED)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
